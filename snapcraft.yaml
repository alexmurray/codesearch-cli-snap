name: codesearch-cli
base: core26
adopt-info: codesearch-cli
summary: Debian Code Search CLI tool
description: |
  Command-line tool for codesearch.debian.net

grade: stable
confinement: strict

environment:
  PYTHONPATH: $SNAP/debian_codesearch_client:$SNAP/usr/lib/python3/dist-packages
  PYTHONIOENCODING: utf-8

apps:
  codesearch-cli:
    command: bin/codesearch
    plugs:
      - network

parts:
  codesearch-cli:
    plugin: python
    source: https://salsa.debian.org/debian/codesearch-cli
    source-type: git
    stage-packages:
      - python3-minimal
      - python3-requests
      - python3-venv
      - python3-websocket
    override-build: |
      patch -p1 < $CRAFT_PROJECT_DIR/0001-HACK-support-setting-host-URI-via-an-environment-var.patch
      craftctl default
      craftctl set version=$(python3 -c "import tomllib; f = open('pyproject.toml', 'rb'); d = tomllib.load(f); print(d['tool']['poetry']['version'])")
